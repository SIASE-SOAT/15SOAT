version: '3.9'

services:

  sonar-postgres:
    image: postgres:16-alpine
    container_name: sonar-postgres
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar_user
      POSTGRES_PASSWORD: sonar_pass
    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar_user -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sonar-network
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10.6-community
    container_name: sonarqube
    depends_on:
      sonar-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar_user
      SONAR_JDBC_PASSWORD: sonar_pass
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sonar-network
    restart: unless-stopped

volumes:
  sonar_postgres_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_logs:
    driver: local
  sonarqube_extensions:
    driver: local

networks:
  sonar-network:
    driver: bridge
