version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: siase-postgres
    environment:
      POSTGRES_DB: siase_db
      POSTGRES_USER: siase_user
      POSTGRES_PASSWORD: siase_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siase_user -d siase_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siase-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siase-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: siase_db
      DB_USER: siase_user
      DB_PASSWORD: siase_pass
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - siase-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  siase-network:
    driver: bridge
