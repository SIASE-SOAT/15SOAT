version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: siase-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-siase_db}
      POSTGRES_USER: ${DB_USER:-siase_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siase_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-siase_user} -d ${DB_NAME:-siase_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siase-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siase-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-siase_db}
      DB_USER: ${DB_USER:-siase_user}
      DB_PASSWORD: ${DB_PASSWORD:-siase_pass}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjAyNA==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:4200}"
      CLIENTE_PORTAL_URL: ${CLIENTE_PORTAL_URL:-http://localhost:4200}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-siase-webhook-token-padrao}
      MECANICO_PASSWORD: ${MECANICO_PASSWORD:-mecanico123}
    ports:
      - "8080:8080"
    networks:
      - siase-network
    restart: on-failure

volumes:
  postgres_data:

networks:
  siase-network:
    driver: bridge
