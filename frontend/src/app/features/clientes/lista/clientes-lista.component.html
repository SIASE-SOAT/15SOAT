<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Clientes</h1>
  <button mat-flat-button (click)="abrirNovoCliente()">
    <mat-icon>add</mat-icon> Novo Cliente
  </button>
</div>

@if (loading()) {
  <div class="flex justify-center py-12"><mat-spinner /></div>
} @else {
  <div class="overflow-auto rounded-lg border border-gray-200">
    <table mat-table [dataSource]="clientes()" class="w-full">

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let c">{{ c.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="documento">
        <th mat-header-cell *matHeaderCellDef>Documento</th>
        <td mat-cell *matCellDef="let c">{{ c.documento }}</td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let c">
          <mat-chip [class]="c.tipoPessoa === 'PF' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'">
            {{ c.tipoPessoa }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>E-mail</th>
        <td mat-cell *matCellDef="let c">{{ c.email ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="telefone">
        <th mat-header-cell *matHeaderCellDef>Telefone</th>
        <td mat-cell *matCellDef="let c">{{ c.telefone ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let c">
          <button mat-icon-button aria-label="Editar cliente" (click)="editarCliente(c)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;" class="hover:bg-gray-50"></tr>
    </table>
  </div>
}
