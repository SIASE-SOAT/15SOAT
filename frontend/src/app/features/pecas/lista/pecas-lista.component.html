<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Peças e Insumos</h1>
  <button mat-flat-button (click)="abrirNovaPeca()"><mat-icon>add</mat-icon> Nova Peça</button>
</div>

@if (loading()) {
  <div class="flex justify-center py-12"><mat-spinner /></div>
} @else {
  <div class="overflow-auto rounded-lg border border-gray-200">
    <table mat-table [dataSource]="pecas()" class="w-full">

      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let p">
          <span class="font-mono text-sm">{{ p.codigo }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let p">{{ p.nome }}</td>
      </ng-container>

      <ng-container matColumnDef="preco">
        <th mat-header-cell *matHeaderCellDef>Preço</th>
        <td mat-cell *matCellDef="let p">R$ {{ p.preco | number:'1.2-2' }}</td>
      </ng-container>

      <ng-container matColumnDef="estoque">
        <th mat-header-cell *matHeaderCellDef>Estoque</th>
        <td mat-cell *matCellDef="let p">
          <span
            [class]="p.estoqueAbaixoMinimo ? 'text-red-600 font-semibold' : ''"
            [matTooltip]="p.estoqueAbaixoMinimo ? 'Abaixo do mínimo (' + p.estoqueMinimo + ')' : ''"
          >
            {{ p.quantidadeEstoque }} {{ p.unidadeMedida }}
            @if (p.estoqueAbaixoMinimo) {
              <mat-icon class="!text-base align-middle text-red-500">warning</mat-icon>
            }
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button aria-label="Editar peça" (click)="editarPeca(p)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button aria-label="Movimentar estoque" (click)="movimentarEstoque(p)"><mat-icon>swap_vert</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;" class="hover:bg-gray-50"></tr>
    </table>
  </div>
}
