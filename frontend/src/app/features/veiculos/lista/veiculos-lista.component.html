<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Veículos</h1>
  <button mat-flat-button (click)="abrirNovoVeiculo()"><mat-icon>add</mat-icon> Novo Veículo</button>
</div>

@if (loading()) {
  <div class="flex justify-center py-12"><mat-spinner /></div>
} @else {
  <div class="overflow-auto rounded-lg border border-gray-200">
    <table mat-table [dataSource]="veiculos()" class="w-full">

      <ng-container matColumnDef="placa">
        <th mat-header-cell *matHeaderCellDef>Placa</th>
        <td mat-cell *matCellDef="let v">
          <span class="font-mono font-semibold">{{ v.placa }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="veiculo">
        <th mat-header-cell *matHeaderCellDef>Veículo</th>
        <td mat-cell *matCellDef="let v">{{ v.marca }} {{ v.modelo }} ({{ v.ano }})</td>
      </ng-container>

      <ng-container matColumnDef="cor">
        <th mat-header-cell *matHeaderCellDef>Cor</th>
        <td mat-cell *matCellDef="let v">{{ v.cor ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="cliente">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let v">{{ v.clienteNome }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let v">
          <button mat-icon-button aria-label="Editar veículo" (click)="editarVeiculo(v)"><mat-icon>edit</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;" class="hover:bg-gray-50"></tr>
    </table>
  </div>
}
