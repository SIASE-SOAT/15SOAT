<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">Agendamentos</h1>
  <button mat-flat-button (click)="abrirNovoAgendamento()"><mat-icon>add</mat-icon> Novo Agendamento</button>
</div>

@if (loading()) {
  <div class="flex justify-center py-12"><mat-spinner /></div>
} @else {
  <div class="overflow-auto rounded-lg border border-gray-200">
    <table mat-table [dataSource]="agendamentos()" class="w-full">

      <ng-container matColumnDef="dataHora">
        <th mat-header-cell *matHeaderCellDef>Data/Hora</th>
        <td mat-cell *matCellDef="let a">{{ a.dataHora | date:'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="cliente">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let a">{{ a.clienteNome }}</td>
      </ng-container>

      <ng-container matColumnDef="veiculo">
        <th mat-header-cell *matHeaderCellDef>Veículo</th>
        <td mat-cell *matCellDef="let a">{{ a.veiculoModelo }} ({{ a.veiculoPlaca }})</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let a">
          <mat-chip>{{ a.statusDescricao }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let a">
          <button mat-icon-button aria-label="Confirmar agendamento" (click)="confirmar(a)"
                  [disabled]="a.status !== 'AGENDADO'"><mat-icon>check</mat-icon></button>
          <button mat-icon-button aria-label="Cancelar agendamento" (click)="cancelar(a)"
                  [disabled]="a.status === 'CANCELADO' || a.status === 'REALIZADO'"><mat-icon>close</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;" class="hover:bg-gray-50"></tr>
    </table>
  </div>
}
