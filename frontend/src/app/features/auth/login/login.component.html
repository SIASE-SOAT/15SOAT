<div class="login-page">

  <!-- Painel esquerdo: imagem -->
  <div class="login-image-panel">
    <img src="assets/login-bg.jpg" alt="Oficina mecânica" />
  </div>

  <!-- Painel direito: formulário -->
  <div class="login-form-panel">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-logo">
          <mat-icon>build_circle</mat-icon>
        </div>
        <h1 class="brand-name">SIASE</h1>
        <p class="brand-sub">Sistema de Gestão da Oficina Mecânica</p>
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">

        <div class="input-wrap" [class.input-error]="form.controls.username.invalid && form.controls.username.touched">
          <span class="input-icon"><mat-icon>person</mat-icon></span>
          <span class="input-sep"></span>
          <input
            class="input-field"
            type="text"
            placeholder="Usuário"
            formControlName="username"
            autocomplete="username"
          />
        </div>

        <div class="input-wrap" [class.input-error]="form.controls.password.invalid && form.controls.password.touched">
          <span class="input-icon"><mat-icon>lock</mat-icon></span>
          <span class="input-sep"></span>
          <input
            class="input-field"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="Senha"
            formControlName="password"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pw" (click)="showPassword.update(v => !v)" tabindex="-1">
            <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>

        @if (error()) {
          <div class="error-msg" role="alert">
            <mat-icon>error_outline</mat-icon>
            {{ error() }}
          </div>
        }

        <button type="submit" class="login-btn" [disabled]="loading()">
          @if (loading()) {
            <mat-spinner diameter="20" />
          }
          LOGIN
        </button>

      </form>

      <p class="login-footer">SIASE &copy; 2026</p>

    </div>
  </div>


</div>
