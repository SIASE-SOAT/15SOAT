spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/siase_db
    username: siase_user
    password: siase_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

logging:
  level:
    br.com.fiap.siase: DEBUG
