spring:
  application:
    name: siase

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siase_db}
    username: ${DB_USER:siase_user}
    password: ${DB_PASSWORD:siase_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: SIASE - Sistema Integrado de Atendimento e Execução de Serviços
    description: API REST para gerenciamento de atendimentos e execução de serviços
    version: 1.0.0

logging:
  level:
    br.com.fiap.siase: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
