apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: siase-app-hpa
  namespace: siase
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: siase-app
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
