apiVersion: v1
kind: ConfigMap
metadata:
  name: siase-config
  namespace: siase
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "siase_db"
  SERVER_PORT: "8080"
  JWT_EXPIRATION_MS: "3600000"
  CORS_ALLOWED_ORIGINS: "http://localhost:4200"
  CLIENTE_PORTAL_URL: "http://localhost:4200"
