apiVersion: apps/v1
kind: Deployment
metadata:
  name: siase-frontend
  namespace: siase
  labels:
    app: siase-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siase-frontend
  template:
    metadata:
      labels:
        app: siase-frontend
    spec:
      containers:
        - name: siase-frontend
          image: ECR_REGISTRY/ECR_REPOSITORY:FRONTEND_IMAGE
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AUTH_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: siase-frontend-config
                  key: AUTH_API_HOST
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
