apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: siase-app
  namespace: siase
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      siase-metrics: "true"
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
