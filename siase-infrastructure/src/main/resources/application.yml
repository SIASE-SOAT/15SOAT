spring:
  application:
    name: siase

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siase_db}
    username: ${DB_USER:siase_user}
    password: ${DB_PASSWORD:siase_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:siase_db}
    user: ${DB_USER:siase_user}
    password: ${DB_PASSWORD:siase_pass}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: SIASE - Sistema Integrado de Atendimento e Execução de Serviços
    description: API REST para gerenciamento de atendimentos e execução de serviços
    version: 1.0.0

jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjAyNA==}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

webhook:
  token: ${WEBHOOK_TOKEN:changeme}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

cliente:
  portal-url: ${CLIENTE_PORTAL_URL:http://localhost:4200}

email:
  from: ${MAIL_FROM:${MAIL_USERNAME:noreply@siase.com}}

seed:
  mecanico:
    password: ${MECANICO_PASSWORD:mecanico123}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    br.com.fiap.siase: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
