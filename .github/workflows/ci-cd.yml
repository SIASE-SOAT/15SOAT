name: CI/CD Pipeline

on:
  push:
    branches: [main, feat/infra-k8s-cicd]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ricardo-okuyama/siase-app

jobs:
  # ── 1. BUILD & TEST ────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn clean verify -B -pl siase-infrastructure -am

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  # ── 2. DOCKER BUILD & PUSH ─────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tag (git SHA curto)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── 3. DEPLOY ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to K8s (VPS)
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 600s
          script: |
            set -e

            # Garantir cluster Kind existe
            if ! kind get clusters 2>/dev/null | grep -q siase; then
              echo "=== Criando cluster Kind ==="
              kind create cluster --name siase --config /root/15SOAT/k8s/kind-cluster.yaml
              kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
              kubectl patch deployment metrics-server -n kube-system \
                --type='json' \
                -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
              kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s
            else
              echo "=== Cluster ja existe ==="
            fi

            # Atualizar codigo na VPS
            if [ -d "/root/15SOAT" ]; then
              cd /root/15SOAT
              git fetch origin
              git checkout feat/infra-k8s-cicd
              git pull origin feat/infra-k8s-cicd
            else
              git clone https://x-access-token:${GH_TOKEN}@github.com/ricardo-okuyama/15SOAT.git /root/15SOAT
              cd /root/15SOAT && git checkout feat/infra-k8s-cicd
            fi

            cd /root/15SOAT

            # Aplicar namespace
            kubectl apply -f k8s/namespace.yaml

            # Terraform apply
            cd infra
            terraform init -input=false
            terraform apply -auto-approve \
              -var="image_tag=$IMAGE_TAG" \
              -var="github_user=ricardo-okuyama" \
              -var="db_password=$DB_PASSWORD" \
              -var="jwt_secret=$JWT_SECRET" \
              -var="webhook_token=$WEBHOOK_TOKEN" \
              -var="mecanico_password=$MECANICO_PASSWORD"

            # Aguardar deployments
            kubectl rollout status deployment/postgres -n siase --timeout=180s
            kubectl rollout status deployment/siase-app -n siase --timeout=300s

            # Status final
            kubectl get pods -n siase
            kubectl get hpa -n siase

            # Smoke test
            sleep 15
            curl -f http://localhost:8080/api/actuator/health
            echo "=== Deploy OK ==="
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          MECANICO_PASSWORD: ${{ secrets.MECANICO_PASSWORD }}
