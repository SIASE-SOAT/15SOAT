name: CI/CD Pipeline

on:
  push:
    branches: [main, feat/infra-k8s-cicd]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ricardo-okuyama/siase-app

jobs:
  # ── 1. BUILD & TEST ────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn clean verify -B -pl siase-infrastructure -am

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  # ── 2. DOCKER BUILD & PUSH ─────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tag (git SHA curto)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── 3. DEPLOY ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to K8s (VPS)
    needs: docker-build-push
    runs-on: [self-hosted, siase-vps]
    if: github.event_name == 'push'
    env:
      IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir cluster Kind existe
        run: |
          if ! kind get clusters | grep -q siase; then
            echo "Cluster nao encontrado. Criando..."
            kind create cluster --name siase --config k8s/kind-cluster.yaml
            kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
            kubectl patch deployment metrics-server -n kube-system \
              --type='json' \
              -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
            kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s
          else
            echo "Cluster ja existe."
          fi

      - name: Aplicar namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Terraform init e apply
        working-directory: infra
        env:
          TF_VAR_image_tag: ${{ env.IMAGE_TAG }}
          TF_VAR_github_user: ricardo-okuyama
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_webhook_token: ${{ secrets.WEBHOOK_TOKEN }}
          TF_VAR_mecanico_password: ${{ secrets.MECANICO_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Aguardar Postgres ficar Ready
        run: kubectl rollout status deployment/postgres -n siase --timeout=180s

      - name: Aguardar App ficar Ready
        run: kubectl rollout status deployment/siase-app -n siase --timeout=300s

      - name: Verificar pods e HPA
        run: |
          kubectl get pods -n siase
          kubectl get hpa -n siase

      - name: Smoke test — health check
        run: |
          sleep 10
          curl -f http://localhost:8080/api/actuator/health
          echo "Deploy OK"
