name: Bootstrap Self-hosted Runner (one-time)

on:
  workflow_dispatch:

jobs:
  register-runner:
    name: Register runner on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Get runner registration token
        id: get-token
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ricardo-okuyama/15SOAT/actions/runners/registration-token)
          echo "Response: $RESPONSE"
          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Falha ao obter token. Verifique se ACCESS_TOKEN tem permissao admin no repo."
            exit 1
          fi
          echo "runner_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Register runner on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 300s
          script: |
            set -e

            RUNNER_DIR="/root/actions-runner"
            RUNNER_VERSION="2.316.1"

            # Limpar instalacao anterior se existir
            if [ -d "$RUNNER_DIR" ]; then
              cd "$RUNNER_DIR"
              if [ -f "svc.sh" ]; then
                ./svc.sh stop || true
                ./svc.sh uninstall || true
              fi
              cd /root
              rm -rf "$RUNNER_DIR"
            fi

            mkdir -p "$RUNNER_DIR"
            cd "$RUNNER_DIR"

            # Download do runner
            curl -o actions-runner.tar.gz -L \
              "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-x64-${RUNNER_VERSION}.tar.gz"
            tar xzf actions-runner.tar.gz
            rm actions-runner.tar.gz

            # Instalar dependencias
            ./bin/installdependencies.sh

            # Registrar o runner
            ./config.sh \
              --url https://github.com/ricardo-okuyama/15SOAT \
              --token ${{ steps.get-token.outputs.runner_token }} \
              --labels siase-vps \
              --name siase-vps-runner \
              --unattended \
              --replace

            # Instalar e iniciar como servico
            ./svc.sh install root
            ./svc.sh start

            # Verificar status
            ./svc.sh status
            echo "Runner registrado com sucesso."
